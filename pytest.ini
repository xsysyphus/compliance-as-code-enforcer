[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slower, may require AWS resources)
    slow: Slow running tests

# Environment variables for tests
env =
    AWS_REGION=us-east-1
    LOG_LEVEL=WARNING
    MIN_RDS_BACKUP_DAYS=7
